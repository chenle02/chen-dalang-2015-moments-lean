  file: ChenDalang15/LConv.lean
  status: internal
- id: chen-dalang-15-moments-lean/lstconv-l-le-bcoeff-mul
  decl: ChenDalang15.lstConv_ofReal_L_le_BCoeff_mul
  kind: theorem
