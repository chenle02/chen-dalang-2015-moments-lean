  kind: theorem
  summary: "Paper Thm 2.12(1), theta = 0, every p >= 2, CONDITIONAL: for a random field X on a probability space with E|X|^2 >= ofReal(J0^2 * K_l) (E2:SecMom-Lower), mu >= 0 nonzero in M_H,+, l != 0: lower index of E|X|^p >= l^2/2."
