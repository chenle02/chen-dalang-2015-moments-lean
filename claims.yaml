  kind: theorem
  summary: "Paper Thm 2.12(3), p = 2, for every solution of the PAM (no moment hypothesis): mu != 0, lam^2/(2nu) <= beta, int e^(beta|y|) dmu < oo: both growth indices of E u^2 equal lam^2/2. Existence is Wave S3."
  keywords: [growth-index, t2-growth, random-field-solution]
  file: ChenDalang15/SolutionMoments.lean
  status: internal
- id: chen-dalang-15-moments-lean/second-moment-eq-quasilinear-of-solution
  decl: ChenDalang15.Stoch.secondMoment_eq_quasilinear_of_solution
  kind: theorem
