  kind: theorem
  summary: "Paper Thm 2.12(1), theta != 0, every p >= 2, CONDITIONAL on E|X|^2 >= ofReal(theta^2 (1 * K_l)) (E2:SecMom-Lower), l != 0: lower and upper growth indices of E|X|^p are both +infinity."
  keywords: [growth-index, conditional, t2-growth]
  file: ChenDalang15/S1Glue.lean
  status: internal
- id: chen-dalang-15-moments-lean/t2-growth-three
  decl: ChenDalang15.T2_Growth_three
