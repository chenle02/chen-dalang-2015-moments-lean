  summary: "Paper Thm 2.12(1), theta = 0, p = 2, for every solution (no moment hypothesis): rho^2 >= lip^2 z^2, mu != 0 in M_H,+: lower growth index of E u^2 >= lip^2/2. Existence is Wave S3."
  keywords: [growth-index, t2-growth, random-field-solution]
