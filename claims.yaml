schema: claims/1
package: chen-dalang-15-moments-lean
claims:
- id: chen-dalang-15-moments-lean/g-eq-formula
  decl: ChenDalang15.G_eq_formula
  kind: theorem
  summary: "Fidelity: G nu t x equals 1/sqrt(2 pi nu t) exp(-x^2/(2 nu t)) under Lean's conventions (sqrt of a negative number is 0, 1/0 = 0) for all real nu, t, x (G_eq_formula, by definition); for nu > 0, t <= 0 it is 0, the paper's convention G = 0."
  keywords: [heat-kernel, normalization, fidelity]
  file: ChenDalang15/Kernel.lean
  status: internal
- id: chen-dalang-15-moments-lean/integral-rpow-mul-sub-rpow
  decl: ChenDalang15.integral_rpow_mul_sub_rpow
  kind: theorem
  summary: "Real Beta integral on [0,t]: for a, b, t > 0, the integral of s^(a-1) (t-s)^(b-1) over [0,t] is t^(a+b-1) Gamma(a) Gamma(b) / Gamma(a+b) (paper E2:BetaInt)."
  keywords: [beta-integral, gamma]
  file: ChenDalang15/Beta.lean
  status: internal
- id: chen-dalang-15-moments-lean/l-eq
  decl: ChenDalang15.L_eq
  kind: theorem
  summary: "Paper P2:K, E:KS-LB: for nu > 0, t > 0, L_n(t,x) = G_{nu/2}(t,x) (b sqrt pi)^(n+1) / Gamma((n+1)/2) t^((n-1)/2), b = lam^2/sqrt(4 pi nu), with L_0 = lam^2 G_nu^2 and L_{n+1} = L_n * L_0."
  keywords: [resolvent-kernel, heat-kernel, p2-k]
  file: ChenDalang15/Resolvent.lean
  status: internal
- id: chen-dalang-15-moments-lean/l-eq-l-zero-mul-bcoeff
  decl: ChenDalang15.L_eq_L_zero_mul_BCoeff
  kind: theorem
  summary: "Paper P2:K, E:KS-LB second form: L_n(t,x) = L_0(t,x) B_n(t) for nu > 0, t > 0."
  keywords: [resolvent-kernel, p2-k]
  file: ChenDalang15/Summability.lean
  status: internal
- id: chen-dalang-15-moments-lean/summable-bcoeff-rpow
  decl: ChenDalang15.summable_BCoeff_rpow
  kind: theorem
  summary: "Paper P2:K: for b, t >= 0 and every integer m >= 1, the series of B_n(t)^(1/m) converges."
  keywords: [summability, gamma, p2-k]
  file: ChenDalang15/Summability.lean
  status: internal
- id: chen-dalang-15-moments-lean/phi-eq-erf
  decl: ChenDalang15.Phi_eq_erf
  kind: theorem
  summary: "Phi(x) = (1 + Erf(x/sqrt 2))/2 for the paper's definitions of Phi and Erf."
  keywords: [error-function, normal-distribution]
  file: ChenDalang15/ErfSeries.lean
  status: internal
- id: chen-dalang-15-moments-lean/has-sum-pow-div-gamma
  decl: ChenDalang15.hasSum_pow_div_Gamma
  kind: theorem
  summary: "For z >= 0, the sum over k of z^k / Gamma(k/2 + 1) equals exp(z^2) (1 + Erf z) (DLMF 7.6.2, used in P2:K)."
  keywords: [error-function, series, gamma]
  file: ChenDalang15/ErfSeries.lean
  status: internal
- id: chen-dalang-15-moments-lean/integral-exp-mul-phi
  decl: ChenDalang15.integral_exp_mul_Phi
  kind: theorem
  summary: "Paper LA:Phi-E for b > 0: pi times the integral over [0,t] of exp(pi b^2 u) Phi(sqrt(2 pi b^2 u)) equals exp(pi b^2 t) Phi(sqrt(2 pi b^2 t))/b^2 - 1/(2 b^2) - sqrt(t)/b."
  keywords: [normal-distribution, la-phi-e]
  file: ChenDalang15/PhiE.lean
  status: internal
- id: chen-dalang-15-moments-lean/integral-exp-mul-phi-false-of-neg
  decl: ChenDalang15.integral_exp_mul_Phi_false_of_neg
  kind: theorem
  summary: "No-go: the identity of LA:Phi-E fails at b = -1, t = 1, so the paper's hypothesis b != 0 must be b > 0 (ERRATA E1)."
  keywords: [no-go, erratum, la-phi-e]
  file: ChenDalang15/PhiE.lean
  status: internal
- id: chen-dalang-15-moments-lean/has-sum-l
  decl: ChenDalang15.hasSum_L
  kind: theorem
  summary: "Paper P2:K, E:K with convergence: for nu > 0, t > 0 the series of L_n(t,x) converges to G_{nu/2}(t,x) (lam^2/sqrt(4 pi nu t) + lam^4/(2 nu) exp(lam^4 t/(4 nu)) Phi(lam^2 sqrt(t/(2 nu))))."
  keywords: [resolvent-kernel, p2-k]
  file: ChenDalang15/KClosed.lean
  status: internal
- id: chen-dalang-15-moments-lean/k-eq
  decl: ChenDalang15.K_eq
  kind: theorem
  summary: "Paper P2:K, display E:K: closed form of K(t,x) = sum of L_n(t,x) for nu > 0, t > 0."
  keywords: [resolvent-kernel, p2-k]
  file: ChenDalang15/KClosed.lean
  status: internal
- id: chen-dalang-15-moments-lean/k-conv-l-zero
  decl: ChenDalang15.K_conv_L_zero
  kind: theorem
  summary: "Paper P2:K, display E:KS-Kn-K0: (K * L_0)(t,x) = K(t,x) - L_0(t,x) for nu > 0, t > 0, with * the space-time convolution."
  keywords: [resolvent-kernel, convolution, p2-k]
  file: ChenDalang15/KConv.lean
  status: internal
- id: chen-dalang-15-moments-lean/one-conv-k
  decl: ChenDalang15.one_conv_K
  kind: theorem
  summary: "Paper display E2:H: for nu > 0, t >= 0 and every x, H(t) = (1 * K)(t,x) = 2 exp(lam^4 t/(4 nu)) Phi(lam^2 sqrt(t/(2 nu))) - 1, with * the space-time convolution."
  keywords: [resolvent-kernel, convolution, e2-h]
  file: ChenDalang15/H.lean
  status: internal
- id: chen-dalang-15-moments-lean/palomar-p2k-l-closed-form
  decl: ChenDalang2015.P2K_L_closed_form
  kind: theorem
  summary: "Palomar Challenge statement of P2:K, E:KS-LB: closed form of L_n(t,x) for nu > 0, t > 0, with b = lam^2/sqrt(4 pi nu) inlined."
  keywords: [palomar, challenge]
  file: Solution.lean
  status: reusable
- id: chen-dalang-15-moments-lean/palomar-p2k-has-sum
  decl: ChenDalang2015.P2K_hasSum
  kind: theorem
  summary: "Palomar Challenge statement of P2:K, E:K with convergence: the series of L_n(t,x) converges to the closed form of K(t,x)."
  keywords: [palomar, challenge]
  file: Solution.lean
  status: reusable
- id: chen-dalang-15-moments-lean/palomar-p2k-k-closed-form
  decl: ChenDalang2015.P2K_K_closed_form
  kind: theorem
  summary: "Palomar Challenge statement of P2:K, display E:K: closed form of K(t,x)."
  keywords: [palomar, challenge]
  file: Solution.lean
  status: reusable
- id: chen-dalang-15-moments-lean/palomar-p2k-resolvent
  decl: ChenDalang2015.P2K_resolvent
  kind: theorem
  summary: "Palomar Challenge statement of P2:K, display E:KS-Kn-K0: (K * L_0)(t,x) = K(t,x) - L_0(t,x)."
  keywords: [palomar, challenge]
  file: Solution.lean
  status: reusable
- id: chen-dalang-15-moments-lean/palomar-p2k-summable
  decl: ChenDalang2015.P2K_summable
  kind: theorem
  summary: "Palomar Challenge statement of the P2:K summability claim: the series of B_n(t)^(1/m) converges for t >= 0, m >= 1, with B_n inlined."
  keywords: [palomar, challenge]
  file: Solution.lean
  status: reusable
- id: chen-dalang-15-moments-lean/palomar-e2h-closed-form
  decl: ChenDalang2015.E2H_closed_form
  kind: theorem
  summary: "Palomar Challenge statement of display E2:H: (1 * K)(t,x) = 2 exp(lam^4 t/(4 nu)) Phi(lam^2 sqrt(t/(2 nu))) - 1."
  keywords: [palomar, challenge]
  file: Solution.lean
  status: reusable
- id: chen-dalang-15-moments-lean/palomar-la-phi-e
  decl: ChenDalang2015.LA_Phi_E
  kind: theorem
  summary: "Palomar Challenge statement of Lemma LA:Phi-E for b > 0."
  keywords: [palomar, challenge]
  file: Solution.lean
  status: reusable
- id: chen-dalang-15-moments-lean/palomar-la-phi-e-false-at-neg-one
  decl: ChenDalang2015.LA_Phi_E_false_at_neg_one
  kind: theorem
  summary: "Palomar Challenge statement: the identity of LA:Phi-E fails at b = -1, t = 1 (erratum E1)."
  keywords: [palomar, challenge]
  file: Solution.lean
  status: reusable
- id: chen-dalang-15-moments-lean/integral-g-mul-g-time
  decl: ChenDalang15.integral_G_mul_G_time
  kind: theorem
  summary: "Paper L2:IntGG (Lemma A.10): for nu, sigma, t > 0 and all x, y, int_0^t G_nu(r,x) G_sigma(t-r,y) dr = Erfc((|x|/sqrt nu + |y|/sqrt sigma)/sqrt(2t)) / (2 sqrt(nu sigma))."
  keywords: [heat-kernel, erfc, appendix]
  file: ChenDalang15/IntGG.lean
  status: internal
- id: chen-dalang-15-moments-lean/integral-g-div-sqrt
  decl: ChenDalang15.integral_G_div_sqrt
  kind: theorem
  summary: "Paper L2:IntGG, case x = 0: for nu, sigma, t > 0, int_0^t G_sigma(t-r,y)/sqrt(2 pi nu r) dr = Erfc(|y|/sqrt(2 sigma t)) / (2 sqrt(nu sigma))."
  keywords: [heat-kernel, erfc, appendix]
  file: ChenDalang15/IntGG.lean
  status: internal
- id: chen-dalang-15-moments-lean/integral-g-div-sqrt-le
  decl: ChenDalang15.integral_G_div_sqrt_le
  kind: theorem
  summary: "Paper L2:IntGG, bound: for nu, sigma, t > 0, Erfc(|y|/sqrt(2 sigma t)) / (2 sqrt(nu sigma)) <= sqrt(pi t)/sqrt(2 nu) G_sigma(t,y) (from Erfc z <= exp(-z^2), z >= 0)."
  keywords: [heat-kernel, erfc, appendix]
  file: ChenDalang15/IntGG.lean
  status: internal
- id: chen-dalang-15-moments-lean/integral-g-time
  decl: ChenDalang15.integral_G_time
  kind: theorem
  summary: "Paper L:IntIntGG (Lemma A.9), first identity: for nu > 0, 0 < t <= tau, int_t^tau G_nu(r,x) dr = (2|x|/nu)(Phi(|x|/sqrt(nu tau)) - Phi(|x|/sqrt(nu t))) + 2 tau G_nu(tau,x) - 2 t G_nu(t,x)."
  keywords: [heat-kernel, appendix]
  file: ChenDalang15/IntGG.lean
  status: internal
- id: chen-dalang-15-moments-lean/integral-integral-g-mul-g
  decl: ChenDalang15.integral_integral_G_mul_G
  kind: theorem
  summary: "Paper L:IntIntGG, second identity for 0 < t < tau: int_0^t int_R G_nu(t-r,x-z) G_nu(tau-r,y-z) dz dr in closed form via Phi and G_nu at tau+t and tau-t."
  keywords: [heat-kernel, space-time, appendix]
  file: ChenDalang15/IntGG.lean
  status: internal
- id: chen-dalang-15-moments-lean/integral-integral-g-mul-g-diag
  decl: ChenDalang15.integral_integral_G_mul_G_diag
  kind: theorem
  summary: "Paper L:IntIntGG, second identity at tau = t > 0 (paper's convention Phi(|x-y|/0) = 1): the overlap integral equals (|x-y|/nu)(Phi(|x-y|/sqrt(2 nu t)) - 1) + 2t G_nu(2t,x-y)."
  keywords: [heat-kernel, space-time, appendix]
  file: ChenDalang15/IntGG.lean
  status: internal
- id: chen-dalang-15-moments-lean/integral-h-add-one-mul-g
  decl: ChenDalang15.integral_H_add_one_mul_G
  kind: theorem
  summary: "Paper L2:IntHG (Lemma A.6) with H+1 = 2 exp(lam^4 r/(4nu)) Phi(lam^2 sqrt(r/(2nu))): for nu, t > 0, lam != 0, int_0^t (H(r)+1) G_{2nu}(t-r,x) dr equals the paper's Erfc closed form."
  keywords: [resolvent-kernel, erfc, appendix]
  file: ChenDalang15/IntHG.lean
  status: internal
- id: chen-dalang-15-moments-lean/integral-one-conv-k-add-one-mul-g
  decl: ChenDalang15.integral_one_conv_K_add_one_mul_G
  kind: theorem
  summary: "Paper L2:IntHG stated with H = 1 * K itself (via E2:H): for nu, t > 0, lam != 0, int_0^t ((1*K)(r,x) + 1) G_{2nu}(t-r,x) dr equals the paper's Erfc closed form."
  keywords: [resolvent-kernel, erfc, appendix]
  file: ChenDalang15/IntHG.lean
  status: internal
- id: chen-dalang-15-moments-lean/l2-inthg-bc
  decl: ChenDalang15.L2_IntHG_BC
  kind: theorem
  summary: "Paper L2:IntHG-BC (Lemma A.7), Bertini-Cancrini's integral in closed form: for nu, t > 0 and x != 0 the r-integral equals exp((t-2|x|)/(4nu)) Erfc((|x|-t)/sqrt(4 nu t)). The paper states t >= 0; t = 0 holds only as a limit."
  keywords: [bertini-cancrini, erfc, appendix]
  file: ChenDalang15/IntBC.lean
  status: internal
- id: chen-dalang-15-moments-lean/l2-inthg-bc-t-zero-junk
  decl: ChenDalang15.L2_IntHG_BC_t_zero_junk
  kind: theorem
  summary: "Lean junk-value convention note, no mathematical content about the paper: Lean reads Erfc(|x|/sqrt 0) as erfc 0 = 1 (x/0 = 0 in Lean), so the literal t = 0 instance of the L2:IntHG-BC display is false in Lean (left side 0)."
  keywords: [lean-convention, junk-value]
  file: ChenDalang15/IntBC.lean
  status: internal
- id: chen-dalang-15-moments-lean/l2-tp-delta-bc
  decl: ChenDalang15.L2_TP_Delta_BC
  kind: theorem
  summary: "Paper L2:TP-Delta-BC (Lemma A.8) for x != y: Bertini-Cancrini's two-point integral (2.32) equals G_nu(t,x)G_nu(t,y) + G_{nu/2}(t,(x+y)/2) exp((t-2|x-y|)/(4nu)) Erfc((|x-y|-t)/sqrt(4nu t))/(4nu), nu, t > 0."
  keywords: [bertini-cancrini, two-point, appendix]
  file: ChenDalang15/IntBC.lean
  status: internal
- id: chen-dalang-15-moments-lean/l2-tp-delta-bc-false-of-eq
  decl: ChenDalang15.L2_TP_Delta_BC_false_of_eq
  kind: theorem
  summary: "No-go: L2:TP-Delta-BC fails at x = y for every nu, t > 0 (the integral (2.32) has the factor |x-y| and vanishes, the closed form is positive), so the lemma needs x != y (ERRATA E2)."
  keywords: [no-go, erratum, bertini-cancrini]
  file: ChenDalang15/IntBC.lean
  status: internal
- id: chen-dalang-15-moments-lean/t2-growth-lower
  decl: ChenDalang15.T2_Growth_lower
  kind: theorem
  summary: "Paper T2:Growth(1) (Thm 2.12), vip = 0, p = 2, CONDITIONAL: for a nonnegative measure mu != 0 in M_{H,+}, nu > 0, l != 0, assuming the moment inequality (J0^2 * K_l)(t,x) <= g(t,x) for all t > 0 (from E2:SecMom-Lower, T2:ExUni(4)), lowerGrowthIndex g >= l^2/2."
  keywords: [growth-index, conditional, t2-growth]
  file: ChenDalang15/GrowthTheorem.lean
  status: internal
- id: chen-dalang-15-moments-lean/t2-growth-lower-top
  decl: ChenDalang15.T2_Growth_lower_top
  kind: theorem
  summary: "Paper T2:Growth(1) (Thm 2.12), vip != 0, p = 2, CONDITIONAL: for nu > 0, l != 0, v != 0, assuming the moment inequality v^2 H_l(t) <= g(t,x) for all t > 0, x (from E2:SecMom-Lower, T2:ExUni(4)), both growth indices of g are +infinity."
  keywords: [growth-index, conditional, t2-growth]
  file: ChenDalang15/GrowthTheorem.lean
  status: internal
- id: chen-dalang-15-moments-lean/t2-growth-upper
  decl: ChenDalang15.T2_Growth_upper
  kind: theorem
  summary: "Paper T2:Growth(2) (Thm 2.12), p = 2, CONDITIONAL: nonnegative mu with int e^{beta|y|} mu(dy) < oo, beta, nu > 0, Lip != 0, assuming g <= J0^2 + J0^2 * K_Lip for t > 0 (E2:SecMom-Up, p = 2, Vip = 0, T2:ExUni(3)): upper index <= beta nu/2 + Lip^4/(8 nu beta) if beta < Lip^2/(2nu), else Lip^2/2."
  keywords: [growth-index, conditional, t2-growth]
  file: ChenDalang15/GrowthTheorem.lean
  status: internal
- id: chen-dalang-15-moments-lean/l2-growth
  decl: ChenDalang15.L2_Growth
  kind: theorem
  summary: "Paper L2:Growth (Lemma 4.1, Conus-Khoshnevisan): for a random field X with a.e.-measurable values under a probability measure and 0 < a <= b, both exponential growth indices of E|X(t,x)|^p are nondecreasing from p = a to p = b (paper: 2 <= a)."
  keywords: [growth-index, moments, l2-growth]
  file: ChenDalang15/GrowthIndex.lean
  status: internal
- id: chen-dalang-15-moments-lean/l2-plbd
  decl: ChenDalang15.L2_pLbd
  kind: theorem
  summary: "Paper L2:pLbd (Lemma 4.2): for a nonnegative measure mu != 0 with int exp(-a y^2) mu(dy) < oo for all a > 0, and eps > 0, 0 < xi < nu, there is a > 0 with a G_xi(t,x) <= J0(t,x) for all t >= eps and all x."
  keywords: [heat-kernel, lower-bound, l2-plbd]
  file: ChenDalang15/GrowthLower.lean
  status: internal
- id: chen-dalang-15-moments-lean/l2-maxgge
  decl: ChenDalang15.L2_MaxGGE
  kind: theorem
  summary: "Paper L2:MaxGGE (Lemma 4.3, E2:Hxbts): for nu, t, s, beta > 0 and all x, z1, z2, G_{2nu}(s,z2-z1) G_{nu/2}(t,x-(z1+z2)/2) exp(-beta|z1|-beta|z2|) <= (2 pi nu sqrt(ts))^(-1) exp(-2beta|x| + nu beta^2 t)."
  keywords: [heat-kernel, upper-bound, l2-maxgge]
  file: ChenDalang15/GrowthUpper.lean
  status: internal
- id: chen-dalang-15-moments-lean/l2-indt-g-j0
  decl: ChenDalang15.L2_InDt_G_J0
  kind: theorem
  summary: "Paper L2:InDt-G (Lemma 4.4, E2:J0Bd-G): for a nonnegative measure mu with C = int e^{beta|y|} mu(dy) < oo and nu, beta, t > 0, J0(t,x)^2 <= C^2/(2 pi nu t) exp(-2beta|x| + nu beta^2 t) for every x."
  keywords: [heat-kernel, upper-bound, l2-indt-g]
  file: ChenDalang15/GrowthUpper.lean
  status: internal
- id: chen-dalang-15-moments-lean/l2-indt-g-conv
  decl: ChenDalang15.L2_InDt_G_conv
  kind: theorem
  summary: "Paper L2:InDt-G (Lemma 4.4), convolution bound: nonnegative mu, C = int e^{beta|y|} dmu < oo, nu, beta, t > 0, h >= 0 with s -> h(t-s)/sqrt s integrable on [0,t]: (J0^2 * G_{nu/2} h)(t,x) <= C^2/(2 pi nu sqrt t) e^{-2beta|x|+nu beta^2 t} int_0^t h(t-s)/sqrt s ds."
  keywords: [heat-kernel, convolution, l2-indt-g]
  file: ChenDalang15/GrowthUpper.lean
  status: internal
- id: chen-dalang-15-moments-lean/upper-growth-index-le-piecewise
  decl: ChenDalang15.upperGrowthIndex_le_piecewise
  kind: theorem
  summary: "Optimisation step of T2:Growth(2): if for every beta in (0, beta0] f(t,x) <= A e^{(nu beta^2 + L^4/(4nu))t - 2beta|x|} for large t (nu, L, beta0 > 0), then the upper growth index of f is <= beta0 nu/2 + L^4/(8 nu beta0) if beta0 < L^2/(2nu), else <= L^2/2."
  keywords: [growth-index, t2-growth]
  file: ChenDalang15/GrowthIndex.lean
  status: internal
- id: chen-dalang-15-moments-lean/ex-exp-lower-index-of-envelope
  decl: ChenDalang15.exExp_lowerIndex_of_envelope
  kind: theorem
  summary: "P2:Ex-Exp lower bound, CONDITIONAL on the minorant of its proof: if f(t,x) >= E_{nu t/2,-2beta}(x) e^{beta^2 nu t} Phi(-beta sqrt(nu(1-c)t))^2 (e^{gt} - e^{cgt}), g = lam^4/(4nu), for each c in [0,1) and large t, then lower index >= the piecewise value of E2:Ex-Exp."
  keywords: [growth-index, conditional, p2-ex-exp]
  file: ChenDalang15/ExExpLower.lean
  status: internal
- id: chen-dalang-15-moments-lean/ex-exp-growth-eq
  decl: ChenDalang15.exExp_growth_eq
  kind: theorem
  summary: "Paper P2:Ex-Exp (Prop 2.14), CONDITIONAL: nu, beta > 0, lam != 0; assuming the proof's minorant of f = E u^2 (from E2:SecMom) and the T2:Growth(2) envelopes f <= A e^{(nu b^2 + lam^4/(4nu))t - 2b|x|} for each b in (0,beta), both indices equal display E2:Ex-Exp."
  keywords: [growth-index, conditional, p2-ex-exp]
  file: ChenDalang15/ExExpLower.lean
  status: internal
- id: chen-dalang-15-moments-lean/c2-secmom-lebesgue
  decl: ChenDalang15.C2_SecMom_Lebesgue
  kind: theorem
  summary: "Paper C2:TP-Lebesgue (Cor 2.5), display (2.28), deterministic part: with J0 = 1 and nu > 0, the E2:SecMom expression J0^2 + J0^2 * K + v^2 H equals 1 + (1 + v^2) H(t) for t > 0. Equals E|u|^2 only given T2:ExUni(5) (not formalized)."
  keywords: [two-point, lebesgue, c2-tp-lebesgue]
  file: ChenDalang15/TPLebesgue.lean
  status: internal
- id: chen-dalang-15-moments-lean/c2-tp-lebesgue-integral
  decl: ChenDalang15.C2_TP_Lebesgue_integral
  kind: theorem
  summary: "Paper C2:TP-Lebesgue (Cor 2.5), correct integral form: J0 = 1, nu > 0, tau >= t > 0: 1 + I(t,x,tau,y) (rd1) = 1 + lam^2 (1+v^2) int_0^t (H(r)+1) G_{2nu}((t+tau)/2 - r, x-y) dr. Deterministic; E[u u] needs T2:ExUni(5)."
  keywords: [two-point, lebesgue, c2-tp-lebesgue]
  file: ChenDalang15/TPLebesgue.lean
  status: internal
- id: chen-dalang-15-moments-lean/c2-tp-lebesgue-diag
  decl: ChenDalang15.C2_TP_Lebesgue_diag
  kind: theorem
  summary: "Paper Cor 2.5, (2.27) at tau = t, deterministic part: J0 = 1, nu > 0, lam != 0, t > 0: 1 + I(t,x,t,y) equals the printed exp-Erfc closed form with tbar = t. lam != 0 assumed; lam = 0 is trivial (both sides 1) and not stated. Equals E[u(t,x)u(t,y)] only given T2:ExUni(5)."
  keywords: [two-point, lebesgue, c2-tp-lebesgue]
  file: ChenDalang15/TPLebesgue.lean
  status: internal
- id: chen-dalang-15-moments-lean/c2-tp-lebesgue-false
  decl: ChenDalang15.C2_TP_Lebesgue_false
  kind: theorem
  summary: "No-go: display (2.27) of C2:TP-Lebesgue as printed (all tau >= t > 0) is false for the two-point expression 1 + I (J0 = 1) for every nu > 0, lam != 0, v; it fails at t = 1, tau = 2, x = y = 0 (ERRATA E3)."
  keywords: [no-go, erratum, c2-tp-lebesgue]
  file: ChenDalang15/TPLebesgue.lean
  status: internal
- id: chen-dalang-15-moments-lean/c2-secmom-delta
  decl: ChenDalang15.C2_SecMom_Delta
  kind: theorem
  summary: "Paper C2:TP-Delta (Cor 2.8), E2:SecMom-Delta, deterministic part: for J0 = G_nu (delta data), nu > 0, lam != 0, every v, t > 0, x: G^2 + G^2 * K + v^2 H = K(t,x)/lam^2 + v^2 H(t). Equals E|u|^2 only given T2:ExUni(5)."
  keywords: [two-point, delta, c2-tp-delta]
  file: ChenDalang15/TPDelta.lean
  status: internal
- id: chen-dalang-15-moments-lean/c2-tp-delta
  decl: ChenDalang15.C2_TP_Delta
  kind: theorem
  summary: "Paper Cor 2.8, (2.30) E2:TP-Delta, deterministic part: J0 = G_nu, nu > 0, lam != 0, t > 0: G(t,x)G(t,y) + I(t,x,t,y) equals the printed erfc closed form. lam != 0 assumed; lam = 0 is trivial (both sides G G) and not stated. Equals E[u(t,x)u(t,y)] only given T2:ExUni(5)."
  keywords: [two-point, delta, c2-tp-delta]
  file: ChenDalang15/TPDelta.lean
  status: internal
- id: chen-dalang-15-moments-lean/integral-exp-mul-abs-mul-g
  decl: ChenDalang15.integral_exp_mul_abs_mul_G
  kind: theorem
  summary: "Paper P2:E(ii) (Prop A.11): for nu, t > 0 and all beta, x, the integral of e^{beta|y|} G_nu(t, x-y) dy equals e^{beta^2 nu t/2} E_{nu t, beta}(x)."
  keywords: [heat-kernel, gaussian-integral, p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/strict-convex-on-eac
  decl: ChenDalang15.strictConvexOn_Eac
  kind: theorem
  summary: "Paper P2:E(v) (Prop A.11), beta > 0: for a > 0, x -> E_{a,beta}(x) is strictly convex on R."
  keywords: [convexity, p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/eac-le-exp-neg-abs
  decl: ChenDalang15.Eac_le_exp_neg_abs
  kind: theorem
  summary: "Paper P2:E(iv) (Prop A.11), beta < 0, upper bound: for a > 0, beta < 0 and every x, E_{a,beta}(x) <= exp(-|beta x|)."
  keywords: [gaussian-integral, p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/log-rel-s-inf
  decl: ChenDalang15.logRel_sInf
  kind: theorem
  summary: "Paper L2:LogRel (Lemma A.2), corrected infimum: for 0 < a < b, the infimum over s in [0,a) of (a-s)(b-s) log((b-s)/(a-s)) is 0 (the paper prints (b-a) log(b-a), ERRATA E4)."
  keywords: [logarithm, erratum, l2-logrel]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/log-rel-inf-claim-false
  decl: ChenDalang15.logRel_inf_claim_false
  kind: theorem
  summary: "No-go: the printed claim of L2:LogRel that inf over [0,a) of (a-s)(b-s) log((b-s)/(a-s)) equals (b-a) log(b-a) for all 0 < a < b is false (a = 1, b = 3: infimum 0 versus 2 log 2) (ERRATA E4)."
  keywords: [no-go, erratum, l2-logrel]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/log-rel-is-greatest
  decl: ChenDalang15.logRel_isGreatest
  kind: theorem
  summary: "Paper L2:LogRel (Lemma A.2), supremum: for 0 < a < b, f(s) = (a-s)(b-s) log((b-s)/(a-s)) attains its maximum on [0,a) at s = 0, sup = ab log(b/a) (the only part used, in P2:G-Margin)."
  keywords: [logarithm, l2-logrel]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/j0-exp-measure
  decl: ChenDalang15.J0_exp_measure
  kind: theorem
  summary: "For mu(dx) = e^(-beta|x|)dx and nu, t > 0: J0(t,x) = e^(beta^2 nu t/2) E_(nu t,-beta)(x) (Prop A.11(ii) with -beta), the heat flow of the initial data of Prop 2.14."
  keywords: [heat-flow, p2-ex-exp]
  file: ChenDalang15/ExExpEnvelope.lean
  status: internal
- id: chen-dalang-15-moments-lean/ex-exp-envelope-of-second-moment
  decl: ChenDalang15.exExp_envelope_of_secondMoment
  kind: theorem
  summary: "Prop 2.14's lower envelope, derived: nu, beta > 0, mu = e^(-beta|x|)dx; if f >= J0^2 + J0^2 * K (E2:SecMom, theta = 0) for all t > 0, x, then for each c in [0,1), for all sufficiently large t: f >= E_(nu t/2,-2beta) e^(beta^2 nu t) Phi^2 (e^(gamma t) - e^(c gamma t))."
  keywords: [p2-ex-exp, envelope, erratum]
  file: ChenDalang15/ExExpEnvelope.lean
  status: internal
- id: chen-dalang-15-moments-lean/p2-ex-exp-lower
  decl: ChenDalang15.P2_Ex_Exp_lower
  kind: theorem
  summary: "Paper Prop 2.14 lower bound, CONDITIONAL only on the inequality f >= J0^2 + J0^2 * K (E2:SecMom, theta = 0) for mu = e^(-beta|x|)dx: lower growth index of f >= beta nu/2 + lam^4/(8 nu beta) if beta <= lam^2/(2nu), else lam^2/2."
  keywords: [growth-index, conditional, p2-ex-exp]
  file: ChenDalang15/ExExpEnvelope.lean
  status: internal
- id: chen-dalang-15-moments-lean/p2-ex-exp
  decl: ChenDalang15.P2_Ex_Exp
  kind: theorem
  summary: "Paper Prop 2.14 (P2:Ex-Exp), CONDITIONAL only on the second-moment formula f = J0^2 + J0^2 * K of T2:ExUni(5) (theta = 0) for mu = e^(-beta|x|)dx, beta, nu > 0, lam != 0: lower = upper growth index = display (2.33)."
  keywords: [growth-index, conditional, p2-ex-exp]
  file: ChenDalang15/ExExpEnvelope.lean
  status: internal
- id: chen-dalang-15-moments-lean/l2-maxgge-cases
  decl: ChenDalang15.L2_MaxGGE_cases
  kind: theorem
  summary: "Paper L2:MaxGGE (Lemma 4.3), two-case bound: for nu, t, s, beta > 0 and all x, z1, z2, G_{2nu}(s,z2-z1) G_{nu/2}(t,x-(z1+z2)/2) e^{-beta|z1|-beta|z2|} <= (2 pi nu sqrt(ts))^(-1) times e^{-x^2/(nu t)} if |x| <= nu beta t, else e^{-2beta|x| + nu beta^2 t}."
  keywords: [heat-kernel, upper-bound, l2-maxgge]
  file: ChenDalang15/GrowthUpper.lean
  status: internal
- id: chen-dalang-15-moments-lean/g-sq
  decl: ChenDalang15.G_sq
  kind: theorem
  summary: "Paper L2:GG (Lemma A.4), first identity: for nu, t > 0 and every x, G_nu(t,x)^2 = G_{nu/2}(t,x) (4 pi nu)^(-1/2) t^(-1/2), i.e. (4 pi nu t)^(-1/2) G_{nu/2}(t,x)."
  keywords: [heat-kernel, l2-gg]
  file: ChenDalang15/Resolvent.lean
  status: internal
- id: chen-dalang-15-moments-lean/one-div-le-log-div-div-sub
  decl: ChenDalang15.one_div_le_log_div_div_sub
  kind: theorem
  summary: "Paper L2:LogRel (Lemma A.2), display E2:log: for 0 < a < b, 1/b <= log(b/a)/(b-a)."
  keywords: [logarithm, l2-logrel]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/log-rel-antitone-on
  decl: ChenDalang15.logRel_antitoneOn
  kind: theorem
  summary: "Paper L2:LogRel (Lemma A.2), monotonicity: for 0 < a < b, f(s) = (a-s)(b-s) log((b-s)/(a-s)) is nonincreasing on [0,a)."
  keywords: [logarithm, monotonicity, l2-logrel]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/log-rel-tendsto
  decl: ChenDalang15.logRel_tendsto
  kind: theorem
  summary: "Paper L2:LogRel (Lemma A.2), corrected limit: for a < b, (a-s)(b-s) log((b-s)/(a-s)) tends to 0 as s -> a from below (the paper prints (b-a) log(b-a), ERRATA E4)."
  keywords: [logarithm, erratum, l2-logrel]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/eac-zero-beta
  decl: ChenDalang15.Eac_zero_beta
  kind: theorem
  summary: "Paper P2:E(i) (Prop A.11): E_{a,0}(x) = 1 for all real a and x (the paper has a > 0)."
  keywords: [p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/integrable-exp-mul-abs-mul-g
  decl: ChenDalang15.integrable_exp_mul_abs_mul_G
  kind: theorem
  summary: "Paper P2:E(ii) (Prop A.11), integrability: for nu, t > 0 and all beta, x, y -> e^{beta|y|} G_nu(t, x-y) is integrable on R."
  keywords: [heat-kernel, integrability, p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/eac-has-deriv-at
  decl: ChenDalang15.Eac_hasDerivAt
  kind: theorem
  summary: "Paper P2:E(iii) (Prop A.11), first derivative: for a > 0 and all beta, x, E'_{a,beta}(x) = -beta e^{-beta x} Phi((a beta - x)/sqrt a) + beta e^{beta x} Phi((a beta + x)/sqrt a)."
  keywords: [derivative, p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/eac-has-deriv-at-deriv
  decl: ChenDalang15.Eac_hasDerivAt_deriv
  kind: theorem
  summary: "Paper P2:E(iii) (Prop A.11), second derivative: for a > 0 and all beta, x, the expression of E' has derivative beta sqrt(2/(pi a)) e^{-(a^2 beta^2 + x^2)/(2a)} + beta^2 E_{a,beta}(x)."
  keywords: [derivative, p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/exp-mul-abs-le-eac
  decl: ChenDalang15.exp_mul_abs_le_Eac
  kind: theorem
  summary: "Paper P2:E(iv) (Prop A.11), beta > 0, lower bound: for a > 0, beta > 0 and every x, e^{beta|x|} <= E_{a,beta}(x)."
  keywords: [gaussian-integral, p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/eac-lt-exp-add-exp
  decl: ChenDalang15.Eac_lt_exp_add_exp
  kind: theorem
  summary: "Paper P2:E(iv) (Prop A.11), upper bound: for all real a, beta, x, E_{a,beta}(x) < e^{beta x} + e^{-beta x} (the paper states it for a > 0, beta > 0)."
  keywords: [gaussian-integral, p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/phi-mul-sqrt-eac-two-mul-le-eac
  decl: ChenDalang15.Phi_mul_sqrt_Eac_two_mul_le_Eac
  kind: theorem
  summary: "Paper P2:E(iv) (Prop A.11), beta < 0, lower bound: for a > 0, beta < 0 and every x, Phi(sqrt(a) beta) E_{a,2beta}(x)^(1/2) <= E_{a,beta}(x)."
  keywords: [gaussian-integral, p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/eac-zero
  decl: ChenDalang15.Eac_zero
  kind: theorem
  summary: "Paper P2:E(v) (Prop A.11): E_{a,beta}(0) = 2 Phi(beta sqrt a) for all real a, beta."
  keywords: [p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/eac-zero-le
  decl: ChenDalang15.Eac_zero_le
  kind: theorem
  summary: "Paper P2:E(v) (Prop A.11), beta > 0: for a > 0 and every x, E_{a,beta}(0) <= E_{a,beta}(x)."
  keywords: [p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/is-least-eac-zero
  decl: ChenDalang15.isLeast_Eac_zero
  kind: theorem
  summary: "Paper P2:E(v) (Prop A.11), beta > 0: for a > 0, E_{a,beta}(0) is the least value of E_{a,beta} on R (inf = E_{a,beta}(0), attained)."
  keywords: [p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/one-lt-eac-zero
  decl: ChenDalang15.one_lt_Eac_zero
  kind: theorem
  summary: "Paper P2:E(v) (Prop A.11), beta > 0: for a > 0, 1 < E_{a,beta}(0)."
  keywords: [p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/antitone-on-eac-ici
  decl: ChenDalang15.antitoneOn_Eac_Ici
  kind: theorem
  summary: "Paper P2:E(v) (Prop A.11), beta < 0: for a > 0, E_{a,beta} is nonincreasing (antitone) on [0, oo); the paper says decreasing."
  keywords: [monotonicity, p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/monotone-on-eac-iic
  decl: ChenDalang15.monotoneOn_Eac_Iic
  kind: theorem
  summary: "Paper P2:E(v) (Prop A.11), beta < 0: for a > 0, E_{a,beta} is nondecreasing (monotone) on (-oo, 0]; the paper says increasing."
  keywords: [monotonicity, p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/eac-le-eac-zero
  decl: ChenDalang15.Eac_le_Eac_zero
  kind: theorem
  summary: "Paper P2:E(v) (Prop A.11), beta < 0: for a > 0 and every x, E_{a,beta}(x) <= E_{a,beta}(0)."
  keywords: [p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/is-greatest-eac-zero
  decl: ChenDalang15.isGreatest_Eac_zero
  kind: theorem
  summary: "Paper P2:E(v) (Prop A.11), beta < 0: for a > 0, E_{a,beta}(0) is the greatest value of E_{a,beta} on R (sup = E_{a,beta}(0), attained)."
  keywords: [p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/eac-zero-lt-one
  decl: ChenDalang15.Eac_zero_lt_one
  kind: theorem
  summary: "Paper P2:E(v) (Prop A.11), beta < 0: for a > 0, E_{a,beta}(0) < 1."
  keywords: [p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/eac-has-deriv-at-deriv-zero
  decl: ChenDalang15.Eac_hasDerivAt_deriv_zero
  kind: theorem
  summary: "Paper P2:E(v) (Prop A.11), E''(0): for a > 0 and all beta, the expression of E'_{a,beta} has derivative beta sqrt(2/(pi a)) e^{-beta^2 a/2} + 2 beta^2 Phi(beta sqrt a) at x = 0."
  keywords: [derivative, p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/eac-deriv2-zero-pos
  decl: ChenDalang15.Eac_deriv2_zero_pos
  kind: theorem
  summary: "Paper P2:E(v) (Prop A.11), beta > 0: for a > 0, the expression beta sqrt(2/(pi a)) e^{-beta^2 a/2} + 2 beta^2 Phi(beta sqrt a) (= E''(0) by Eac_hasDerivAt_deriv_zero) is positive."
  keywords: [derivative, p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/eac-deriv2-zero-neg
  decl: ChenDalang15.Eac_deriv2_zero_neg
  kind: theorem
  summary: "Paper P2:E(v) (Prop A.11), beta < 0: for a > 0, the expression beta sqrt(2/(pi a)) e^{-beta^2 a/2} + 2 beta^2 Phi(beta sqrt a) (= E''(0) by Eac_hasDerivAt_deriv_zero) is negative (strict; the paper says <= 0)."
  keywords: [derivative, p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/eac-has-deriv-at-a
  decl: ChenDalang15.Eac_hasDerivAt_a
  kind: theorem
  summary: "Paper P2:E(vi) (Prop A.11): for a > 0 and all beta, x, the derivative of a -> E_{a,beta}(x) is beta/sqrt(2 pi a) e^{-(a^2 beta^2 + x^2)/(2a)}."
  keywords: [derivative, p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/monotone-on-eac-a
  decl: ChenDalang15.monotoneOn_Eac_a
  kind: theorem
  summary: "Paper P2:E(vi) (Prop A.11): for beta >= 0 and every x, a -> E_{a,beta}(x) is nondecreasing on (0, oo) (the paper has beta > 0)."
  keywords: [monotonicity, p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/antitone-on-eac-a
  decl: ChenDalang15.antitoneOn_Eac_a
  kind: theorem
  summary: "Paper P2:E(vi) (Prop A.11): for beta <= 0 and every x, a -> E_{a,beta}(x) is nonincreasing on (0, oo) (the paper has beta < 0)."
  keywords: [monotonicity, p2-e]
  file: ChenDalang15/EacProps.lean
  status: internal
- id: chen-dalang-15-moments-lean/stconv-j0-sq-k-eq-lintegral
  decl: ChenDalang15.MomentBridge.stConv_J0_sq_K_eq_lintegral
  kind: theorem
  summary: "Integrability bridge: for s-finite Gaussian-tempered mu, nu, t > 0, ofReal of the Bochner convolution (J0^2 * K)(t,x) equals the iterated lower integral over s in (0,t], y in R of J0(s,y)^2 K(t-s,x-y); no junk value."
  keywords: [integrability, bridge, convolution]
  file: ChenDalang15/MomentBridge.lean
  status: internal
- id: chen-dalang-15-moments-lean/lintegral-j0-sq-k-lt-top
  decl: ChenDalang15.MomentBridge.lintegral_J0_sq_K_lt_top
  kind: theorem
  summary: "For s-finite Gaussian-tempered mu and nu, t > 0, the iterated lower integral of J0(s,y)^2 K(t-s,x-y) over s in (0,t], y in R is finite."
  keywords: [integrability, bridge]
  file: ChenDalang15/MomentBridge.lean
  status: internal
- id: chen-dalang-15-moments-lean/integrable-j0-sq-k
  decl: ChenDalang15.MomentBridge.integrable_J0_sq_K
  kind: theorem
  summary: "For s-finite Gaussian-tempered mu and nu, t > 0, (s,y) -> J0(s,y)^2 K(t-s,x-y) is integrable on (0,t] x R, so the convolution (J0^2 * K)(t,x) is a genuine Lebesgue integral."
  keywords: [integrability, bridge, convolution]
  file: ChenDalang15/MomentBridge.lean
  status: internal
- id: chen-dalang-15-moments-lean/t2-growth-upper-lintegral
  decl: ChenDalang15.T2_Growth_upper_lintegral
  kind: theorem
  summary: "Paper Thm 2.12(2), p = 2, CONDITIONAL on E2:SecMom-Up stated with the genuine integral: g <= ofReal(J0^2) + iterated lower integral of J0^2 K; mu >= 0 with int e^(beta|y|) dmu < oo, lam != 0. Same piecewise upper bound as T2_Growth_upper."
  keywords: [growth-index, conditional, t2-growth]
  file: ChenDalang15/MomentBridge.lean
  status: internal
- id: chen-dalang-15-moments-lean/p2-ex-exp-lintegral
  decl: ChenDalang15.P2_Ex_Exp_lintegral
  kind: theorem
  summary: "Paper Prop 2.14, CONDITIONAL only on E2:SecMom (theta = 0) stated with the genuine integral: f = ofReal(J0^2) + iterated lower integral of J0^2 K for mu = e^(-beta|x|)dx; both growth indices equal display (2.33)."
  keywords: [growth-index, conditional, p2-ex-exp]
  file: ChenDalang15/MomentBridge.lean
  status: internal
- id: chen-dalang-15-moments-lean/l2-indt-a
  decl: ChenDalang15.L2_InDt_A
  kind: theorem
  summary: "Paper Lemma 3.9 (L2:InDt), display (3.12) as a lower integral at general nu > 0: for every s-finite mu >= 0, t > 0 and measurable h >= 0, int J0*(s,y)^2 G_(nu/2)(t-s,x-y) h(t-s) <= 2 sqrt t J0*(2t,x)^2 int h(t-s)/sqrt s."
  keywords: [heat-flow, l2-indt, convolution]
  file: ChenDalang15/S1Glue.lean
  status: internal
- id: chen-dalang-15-moments-lean/l2-indt-l0
  decl: ChenDalang15.L2_InDt_L0
  kind: theorem
  summary: "Paper Lemma 3.9, display (3.13): for s-finite mu >= 0, nu, t > 0, the lower integral of J0^2 * L_0 at (t,x) is at most lam^2 sqrt(pi t/nu) J0*(2t,x)^2."
  keywords: [heat-flow, l2-indt, resolvent-kernel]
  file: ChenDalang15/S1Glue.lean
  status: internal
- id: chen-dalang-15-moments-lean/l2-indt
  decl: ChenDalang15.L2_InDt
  kind: theorem
  summary: "Paper Lemma 3.9, K case: for s-finite mu >= 0, nu, t > 0 and every lam, the lower integral of J0^2 * K at (t,x) is at most lam^2 sqrt(pi t/nu)(1 + 2 e^(lam^4 t/(4nu))) J0*(2t,x)^2."
  keywords: [heat-flow, l2-indt, resolvent-kernel]
  file: ChenDalang15/S1Glue.lean
  status: internal
- id: chen-dalang-15-moments-lean/l2-indt-lt-top
  decl: ChenDalang15.L2_InDt_lt_top
  kind: theorem
  summary: "For Gaussian-tempered s-finite mu >= 0 and nu, t > 0, the lower integral of J0^2 * K at (t,x) is finite (paper Lemma 3.9 with J0*(2t,x) < oo)."
  keywords: [heat-flow, l2-indt, integrability]
  file: ChenDalang15/S1Glue.lean
  status: internal
