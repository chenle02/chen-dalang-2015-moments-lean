name: Palomar mechanical preflight
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@a93fc88c092faeef1a92b1c905e688aab8e80795
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
