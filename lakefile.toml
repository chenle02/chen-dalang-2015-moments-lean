name = "chen-dalang-15-moments-lean"
defaultTargets = ["ChenDalang15", "Challenge", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679" # tag v4.35.0

[[require]]
name = "RoughHeatKernel"
git = "https://github.com/chenle02/rough-heat-kernel-lean.git"
rev = "d4b93224f565606f4c55681f232cc90d2efbb796" # causal-kernel continuity source

[[require]]
name = "WalshIntegral"
git = "https://github.com/chenle02/walsh-integral-lean.git"
rev = "e0547e67d6a0604f0ed40d06ca7f3b87305bf300" # integral increments and L2 utilities source

[[lean_lib]]
name = "ChenDalang15"
globs = ["ChenDalang15.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
