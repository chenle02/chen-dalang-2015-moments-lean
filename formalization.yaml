fidelity:
  divergences: The adopted stochastic scope is nonnegative data and p = 2, with all-real-p lower conclusions
    as stated. Appendix A.1 requires positive b; a selected counterexample records failure of the printed
    negative-b extension. The public manuscript source is a production-format counterpart, not a byte-identical
    copy of the author manuscript.
