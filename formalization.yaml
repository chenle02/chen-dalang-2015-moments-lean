  - Robert C. Dalang
  id: arXiv:1307.0600v3
  type: journal article
  location: https://doi.org/10.1214/14-AOP954
  relationship: formalizes
  note: Ann. Probab. 43(6) (2015), 3006–3051. The public v3 is the publisher reprint; the author manuscript
    is not byte-identical. Selected statement crosswalk and exact source hashes are documented in docs/PAPER_SOURCE.md.
