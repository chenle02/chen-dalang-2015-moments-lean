status:
  scope: 'Proved at general positive diffusivity: explicit resolvent formulas and summability (Proposition
    2.2), display 2.18, and the positive-b form of Appendix Lemma A.1 with a counterexample to its printed
    negative-b extension. For nonnegative Gaussian-tempered initial measures and globally Lipschitz coefficients,
    the development constructs an actual Walsh integral and full random-field solutions, including L2
    continuity of the integral, and proves a.s. uniqueness separately at each positive-time space point.
    It derives second-moment bounds and the exact quasilinear formula under the stated coefficient-square
    identity. Growth conclusions cover Theorem 2.12(1) for every real p >= 2 and its applicable infinite-index
    branches, parts (2)-(3) at p = 2, and Proposition 2.14 at p = 2. Signed-data existence, higher-p upper
    bounds, two-point stochastic formulas, pathwise continuity and full-paper coverage are excluded.'
