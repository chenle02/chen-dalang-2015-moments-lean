project:
  name: chen-dalang-15-moments-lean
  description: 'Lean 4 formalization of selected results from Chen and Dalang (2015): heat-kernel resolvents,
    full nonnegative-data random-field existence and uniqueness, exact quasilinear second moments and
    growth indices. The stochastic scope is p = 2, with lower-growth conclusions for every real p >= 2.'
  authors:
  - Le Chen
  responsible_maintainers:
  - Le Chen
  license: Apache-2.0
sources:
- title: Moments and growth indices for the nonlinear stochastic heat equation with rough initial conditions
  authors:
